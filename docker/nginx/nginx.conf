worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # Include MIME types to handle file extensions properly
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain text/css application/javascript application/xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on;

    # Trust Traefik's forwarded headers
    set_real_ip_from 172.16.0.0/12;    # Docker networks (172.16-31.x.x.x)
    set_real_ip_from 10.0.0.0/8;       # Other common Docker networks
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # WebSocket connection upgrade map (required for Streamlit's /_stcore/stream)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        client_max_body_size 210M;  # Streamlit allows up to 200MB uploads
        access_log off;
        error_log /var/log/nginx/error.log warn;

        # Reverse proxy for Streamlit application
        location / {
            proxy_pass http://{{COMPOSE_PROJECT_NAME}}-app:8501/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Streamlit uses long-lived WebSocket connections and server-sent events
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
    }
}
